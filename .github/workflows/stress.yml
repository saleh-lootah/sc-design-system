name: stress (temporary)
on:
  push:
    branches: [ci-sticky-flake]
jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm, cache-dependency-path: components/package-lock.json }
      - run: npm run build
      - run: npm ci
        working-directory: components
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with: { chrome-version: stable }
      - run: echo "SC_BROWSER=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: npm run build && npm run build:css
        working-directory: components
      - working-directory: components
        env: { SC_HEADFUL: '1', CI: '' }
        run: |
          fails=0
          for i in $(seq 1 10); do
            xvfb-run -a npx stencil test --e2e -- sc-page/ > run.log 2>&1 || { fails=$((fails+1)); grep -A12 "● sc-page" run.log | head -30; }
            grep "^Tests:" run.log
          done
          echo "failed runs: $fails"; test $fails -eq 0
