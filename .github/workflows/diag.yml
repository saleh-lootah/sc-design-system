name: diag
on:
  push:
    branches: [ci-linux-e2e]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm, cache-dependency-path: components/package-lock.json }
      - run: npm run build
      - run: npm ci
        working-directory: components
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with: { chrome-version: stable }
      - run: echo "SC_BROWSER=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: fc-match Arial; fc-match Tahoma; fc-match sans-serif; fc-list | wc -l
      - run: node scripts/diag/hover.cjs; xvfb-run -a node scripts/diag/hover.cjs
        working-directory: components
      - run: npm run build && npm run build:css
        working-directory: components
      - run: npx stencil test --e2e -- diag.e2e
        working-directory: components
