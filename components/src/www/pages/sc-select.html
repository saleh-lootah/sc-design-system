<h1 class="pg-title sc-type-headline-large" data-ar="القائمة المنسدلة">Select</h1>
<p class="pg-lede sc-type-body-large" data-ar="لاختيار واحد من قائمة أطول من أن تُعرض كأزرار اختيار. قائمة أصلية داخل المكوّن، بشكل حقل النص.">
  One choice from a list too long for radios. A native select inside the component, styled like a text input.
</p>

<section class="pg-section" aria-labelledby="se-default">
  <h2 id="se-default" class="sc-type-headline-small" data-ar="الاستخدام">Usage</h2>
  <div class="pg-card">
    <form id="se-form" novalidate>
      <div class="pg-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr))">
        <sc-select name="emirate" label="Issuing authority" data-ar-label="جهة الإصدار" value="dubai" data-demo-focus>
          <option value="dubai" data-ar="دبي">Dubai</option>
          <option value="abu-dhabi" data-ar="أبوظبي">Abu Dhabi</option>
          <option value="sharjah" data-ar="الشارقة">Sharjah</option>
          <option value="ajman" data-ar="عجمان">Ajman</option>
          <option value="uaq" data-ar="أم القيوين">Umm Al Quwain</option>
          <option value="rak" data-ar="رأس الخيمة">Ras Al Khaimah</option>
          <option value="fujairah" data-ar="الفجيرة">Fujairah</option>
        </sc-select>
        <sc-select name="centre" label="Inspection centre" data-ar-label="مركز الفحص" hint="Choose the one nearest to you" data-ar-hint="يُرجى اختيار المركز الأقرب" required>
          <option value="" data-ar="يُرجى اختيار مركز">Select a centre</option>
          <optgroup label="Dubai">
            <option value="al-quoz" data-ar="القوز">Al Quoz</option>
            <option value="al-barsha" data-ar="البرشاء">Al Barsha</option>
            <option value="al-qusais" data-ar="القصيص">Al Qusais</option>
          </optgroup>
          <optgroup label="Hatta">
            <option value="hatta" data-ar="حتا">Hatta</option>
          </optgroup>
        </sc-select>
      </div>
      <div class="pg-row" style="margin-block-start: var(--sc-space-24)">
        <sc-button type="submit" data-ar="متابعة">Continue</sc-button>
        <sc-button type="reset" variant="tertiary" data-ar="مسح">Clear</sc-button>
      </div>
      <p class="pg-output" id="se-output" role="status"></p>
    </form>
  </div>
</section>

<section class="pg-section" aria-labelledby="se-states">
  <h2 id="se-states" class="sc-type-headline-small" data-ar="الحالات">States</h2>
  <div class="pg-card">
    <div class="pg-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr))">
      <div class="pg-cell">
        <span class="pg-label">error</span>
        <sc-select label="Inspection centre" data-ar-label="مركز الفحص" error="Select an inspection centre" data-ar-error="يُرجى اختيار مركز الفحص">
          <option value="" data-ar="يُرجى اختيار مركز">Select a centre</option>
          <option value="al-quoz" data-ar="القوز">Al Quoz</option>
        </sc-select>
      </div>
      <div class="pg-cell">
        <span class="pg-label">optional</span>
        <sc-select label="Preferred time" data-ar-label="الوقت المفضل" optional>
          <option value="morning" data-ar="صباحًا">Morning</option>
          <option value="evening" data-ar="مساءً">Evening</option>
        </sc-select>
      </div>
      <div class="pg-cell">
        <span class="pg-label">disabled (avoid)</span>
        <sc-select label="Vehicle type" data-ar-label="نوع المركبة" disabled>
          <option value="car" data-ar="سيارة خفيفة">Light vehicle</option>
        </sc-select>
      </div>
    </div>
  </div>
</section>

<section class="pg-section" aria-labelledby="se-arabic">
  <h2 id="se-arabic" class="sc-type-headline-small" data-ar="بالعربية">In Arabic</h2>
  <div class="pg-card" lang="ar" dir="rtl">
    <div class="pg-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr))">
      <sc-select label="جهة الإصدار" value="dubai">
        <option value="dubai">دبي</option>
        <option value="abu-dhabi">أبوظبي</option>
        <option value="sharjah">الشارقة</option>
      </sc-select>
      <sc-select label="مركز الفحص" error="يُرجى اختيار مركز الفحص">
        <option value="">يُرجى اختيار مركز</option>
        <option value="al-quoz">القوز</option>
      </sc-select>
    </div>
    <p class="pg-note" lang="en" dir="ltr">This card is always lang="ar" dir="rtl". The chevron sits at the end (left) and still points down.</p>
  </div>
</section>

<script>
  {
    // data-ar-<attr>="…" swaps an attribute (label, hint, error…) when the toolbar is Arabic.
    const preview = document.getElementById('preview');
    window.scFieldsApply = () => {
      const ar = preview.lang === 'ar';
      for (const el of preview.querySelectorAll('*')) {
        for (const { name, value } of [...el.attributes]) {
          if (!name.startsWith('data-ar-')) continue;
          const attr = name.slice(8);
          if (!el.hasAttribute(`data-en-${attr}`)) el.setAttribute(`data-en-${attr}`, el.getAttribute(attr) ?? '');
          el.setAttribute(attr, ar ? value : el.getAttribute(`data-en-${attr}`));
        }
      }
    };
    if (!window.scFieldsObserver) {
      window.scFieldsObserver = new MutationObserver(() => window.scFieldsApply());
      window.scFieldsObserver.observe(preview, { attributes: true, attributeFilter: ['lang'] });
    }
    window.scFieldsApply();


    const form = document.getElementById('se-form');
    const out = document.getElementById('se-output');
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      if (!form.reportValidity()) return;
      out.textContent = (preview.lang === 'ar' ? 'تم الإرسال: ' : 'Submitted: ') + [...new FormData(form)].map(([k, v]) => `${k}=${v}`).join(', ');
    });
    form.addEventListener('reset', () => (out.textContent = preview.lang === 'ar' ? 'تمت إعادة تعيين النموذج' : 'Form reset'));
  }
</script>
