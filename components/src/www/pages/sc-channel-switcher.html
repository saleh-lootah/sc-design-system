<h1 class="pg-title sc-type-headline-large" data-ar="مبدّل القنوات">Channel switcher</h1>
<p class="pg-lede sc-type-body-large" data-ar="زر يكشف قائمة بالقنوات السبع، لكل منها اسمها ووصفها ولونها. القناة الحالية عليها علامة اختيار.">
  A button that discloses the seven channels, each with its name, a descriptor and its own colour. The current channel carries a check.
</p>
<section class="pg-section" aria-labelledby="cs-demo">
  <h2 id="cs-demo" class="sc-type-headline-small" data-ar="جرّبه">Try it</h2>
  <div class="pg-card" style="display:flex;justify-content:flex-end;min-block-size:520px;align-items:flex-start">
    <sc-channel-switcher links='{"now":"#now-{lang}","transport":"#transport-{lang}","visit":"#visit-{lang}","justice":"#justice-{lang}","build":"#build-{lang}","invest":"#invest-{lang}","trade":"#trade-{lang}"}'></sc-channel-switcher>
  </div>
  <p class="pg-note" data-ar="القناة الحالية من شريط أدوات الصفحة. Esc والنقر خارجه يغلقانه، ومن لوحة المفاتيح يظهر فورًا.">The current channel follows the toolbar's channel. Escape and a click outside close it; from the keyboard it appears instantly.</p>
</section>
