<h1 class="pg-title sc-type-headline-large" data-ar="قائمة الحساب">Account menu</h1>
<p class="pg-lede sc-type-body-large" data-ar="يحل محل تسجيل الدخول بعد الدخول: زر الإشعارات مع عدد غير المقروء، وزر بالأحرف الأولى يكشف الملف الشخصي والإعدادات والتمثيل وتسجيل الخروج.">
  Replaces sign in once the user is signed in: a notifications button with the unread count, and an initials button that discloses profile, settings, representation and sign out.
</p>
<section class="pg-section" aria-labelledby="am-demo">
  <h2 id="am-demo" class="sc-type-headline-small" data-ar="جرّبه">Try it</h2>
  <div class="pg-card" style="display:flex;justify-content:flex-end;min-block-size:440px;align-items:flex-start">
    <sc-account-menu name="Sara Al Mansoori" acting-for="Al Mansoori Trading LLC" profile-href="#profile" settings-href="#settings" representation-href="#act-for" notifications-href="#notifications" unread="3"></sc-account-menu>
  </div>
  <p class="pg-note" data-ar="الاسم يظهر من 1280 بكسل. بلا sign-out-href يكون «تسجيل الخروج» زرًا يطلق الحدث scSignOut.">The name shows from 1280px. Without sign-out-href, Sign out is a button that fires scSignOut.</p>
</section>
