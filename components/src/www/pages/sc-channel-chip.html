<h1 class="pg-title sc-type-headline-large" data-ar="شارة القناة">Channel chip</h1>
<p class="pg-lede sc-type-body-large" data-ar="يشير إلى قناة أخرى تقدّم الخدمة نفسها، بألوان تلك القناة.">
  Points to another channel that also offers the service, in that channel's colours.
</p>

<section class="pg-section" aria-labelledby="cc-subtle">
  <h2 id="cc-subtle" class="sc-type-headline-small" data-ar="خفيفة (افتراضي)">Subtle (default)</h2>
  <div class="pg-card">
    <div class="pg-row" style="flex-wrap: wrap">
      <sc-channel-chip channel="now"></sc-channel-chip>
      <sc-channel-chip channel="transport"></sc-channel-chip>
      <sc-channel-chip channel="visit"></sc-channel-chip>
      <sc-channel-chip channel="justice"></sc-channel-chip>
      <sc-channel-chip channel="build"></sc-channel-chip>
      <sc-channel-chip channel="invest"></sc-channel-chip>
      <sc-channel-chip channel="trade"></sc-channel-chip>
    </div>
    <div class="pg-row">
      <span class="pg-label">link</span>
      <sc-channel-chip channel="transport" href="#transport"></sc-channel-chip>
      <sc-channel-chip channel="visit" href="#visit" data-demo-focus></sc-channel-chip>
    </div>
  </div>
</section>

<section class="pg-section" aria-labelledby="cc-outlined">
  <h2 id="cc-outlined" class="sc-type-headline-small" data-ar="محددة (على خلفية القناة)">Outlined (on a channel tint)</h2>
  <div class="pg-card" style="background: var(--sc-color-channel-subtle)">
    <div class="pg-row" style="flex-wrap: wrap">
      <sc-channel-chip channel="transport" variant="outlined" label="On Dubai Transport"></sc-channel-chip>
      <sc-channel-chip channel="justice" variant="outlined" href="#justice"></sc-channel-chip>
    </div>
  </div>
</section>

<section class="pg-section" aria-labelledby="cc-arabic">
  <h2 id="cc-arabic" class="sc-type-headline-small" data-ar="بالعربية">In Arabic</h2>
  <div class="pg-card" lang="ar" dir="rtl">
    <div class="pg-row" style="flex-wrap: wrap">
      <sc-channel-chip channel="transport"></sc-channel-chip>
      <sc-channel-chip channel="visit" href="#v"></sc-channel-chip>
    </div>
    <p class="pg-note" lang="en" dir="ltr">Always lang="ar" dir="rtl": 16px label, the dot at the right, the chevron mirrored.</p>
  </div>
</section>
